name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint and build
    runs-on: ubuntu-latest
    env:
      # Placeholders so the build can initialise Firebase; nothing talks to it.
      NEXT_PUBLIC_FIREBASE_API_KEY: ci
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-project
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "0"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:0:web:0"
      FIREBASE_ADMIN_CLIENT_EMAIL: ci@ci-project.iam.gserviceaccount.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - name: Build
        run: |
          export FIREBASE_ADMIN_PRIVATE_KEY="$(openssl genrsa 2048 2>/dev/null)"
          npm run build

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx --yes firebase-tools@latest emulators:exec --only firestore --project sparex-rules-test "node test/firestore-rules.test.mjs"

  # Vercel deploys the web app on push, but firestore.rules only goes live
  # through the Firebase CLI. This publishes it after the rules tests pass.
  # Needs a FIREBASE_SERVICE_ACCOUNT repo secret (JSON key for a service
  # account with the "Firebase Rules Admin" role); skipped until it's set.
  deploy-rules:
    name: Deploy Firestore rules
    needs: [web, rules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - name: Deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules --non-interactive
      - name: Skipped
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set; firestore.rules was not deployed."
