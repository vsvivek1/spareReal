name: Mobile app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Upload the Android build to Google Play (internal testing)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android build
    needs: check
    runs-on: ubuntu-latest
    env:
      # Optional overrides. The app's own defaults (mobile/lib/config.dart)
      # are used for anything left unset; empty values are not passed, so they
      # never blank out a default.
      API_BASE: ${{ vars.API_BASE }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      MSG91_WIDGET_ID: ${{ secrets.MSG91_WIDGET_ID }}
      MSG91_TOKEN_AUTH: ${{ secrets.MSG91_TOKEN_AUTH }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          PROPS
      - name: Collect build settings
        run: |
          defines=""
          for name in API_BASE FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID \
            FIREBASE_STORAGE_BUCKET FIREBASE_ANDROID_APP_ID FIREBASE_IOS_APP_ID \
            GOOGLE_SERVER_CLIENT_ID MSG91_WIDGET_ID MSG91_TOKEN_AUTH; do
            if [ -n "${!name}" ]; then defines="$defines --dart-define=$name=${!name}"; fi
          done
          echo "DART_DEFINES=$defines" >> "$GITHUB_ENV"
      - run: flutter pub get
      # Each run gets a higher versionCode, which Play requires per upload.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }} $DART_DEFINES
      - run: flutter build apk --release --build-number=${{ github.run_number }} $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: sparex-android
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
      # Accepts the key file's text or its base64, and says which fields are
      # missing (never the values) when the secret was pasted incompletely.
      - name: Check the Play service-account key
        if: inputs.release && env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          raw = os.environ["PLAY_SERVICE_ACCOUNT_JSON"].strip()
          print(f"Secret length: {len(raw)} characters, starts with {raw[:1]!r}")
          try:
              key = json.loads(raw)
          except ValueError:
              try:
                  key = json.loads(base64.b64decode(raw))
              except Exception:
                  sys.exit("PLAY_SERVICE_ACCOUNT_JSON is not the key file's JSON text (or its base64).")
          if isinstance(key, str):
              key = json.loads(key)
          print("Fields found:", ", ".join(sorted(key)))
          missing = [f for f in ("type", "client_email", "private_key") if f not in key]
          if missing:
              sys.exit("PLAY_SERVICE_ACCOUNT_JSON is missing: " + ", ".join(missing))
          with open(os.path.join(os.environ["RUNNER_TEMP"], "play-key.json"), "w") as f:
              json.dump(key, f)
          PY
      - name: Upload to Google Play (internal testing)
        if: inputs.release && env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/play-key.json
          packageName: com.calecutech.sparex
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    name: iOS build (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Proves the iOS app compiles. Signing and App Store upload need an
      # Apple Developer account; see mobile/README.md.
      - run: flutter build ios --release --no-codesign
