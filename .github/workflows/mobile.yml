name: Mobile app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Upload the Android build to Google Play (internal testing)"
        type: boolean
        default: false

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android build
    needs: check
    runs-on: ubuntu-latest
    env:
      # Same values as the web app's NEXT_PUBLIC_* settings, plus the Android
      # app ID from Firebase (Project settings → Your apps).
      DART_DEFINES: >-
        --dart-define=API_BASE=${{ vars.API_BASE || 'https://spare-real.vercel.app' }}
        --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
        --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID || 'sparex-79653' }}
        --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
        --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }}
        --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }}
        --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        --dart-define=MSG91_WIDGET_ID=${{ secrets.MSG91_WIDGET_ID }}
        --dart-define=MSG91_TOKEN_AUTH=${{ secrets.MSG91_TOKEN_AUTH }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload.jks
          cat > android/key.properties <<PROPS
          storeFile=upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - run: flutter pub get
      # Each run gets a higher versionCode, which Play requires per upload.
      - run: flutter build appbundle --release --build-number=${{ github.run_number }} $DART_DEFINES
      - run: flutter build apk --release --build-number=${{ github.run_number }} $DART_DEFINES
      - uses: actions/upload-artifact@v4
        with:
          name: sparex-android
          path: |
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload to Google Play (internal testing)
        if: inputs.release && env.PLAY_SERVICE_ACCOUNT_JSON != '' && env.ANDROID_KEYSTORE_BASE64 != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.sparex.sparex
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

  ios:
    name: iOS build (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Proves the iOS app compiles. Signing and App Store upload need an
      # Apple Developer account; see mobile/README.md.
      - run: flutter build ios --release --no-codesign
